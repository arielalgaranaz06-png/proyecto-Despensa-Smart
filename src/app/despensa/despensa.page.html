<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>despensa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">despensa</ion-title>
    </ion-toolbar>
  </ion-header>
  <div style="padding:16px">
    <form (submit)="$event.preventDefault(); agregar()">
      <ion-item>
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input [(ngModel)]="newProducto.nombre" name="nombre" placeholder="Ingrese producto"></ion-input>
      </ion-item>
      <div style="margin-top:12px; display:flex; gap:8px">
        <ion-button color="primary" (click)="agregar()">Agregar</ion-button>
      </div>
    </form>

    <ion-list>
      <ion-item *ngFor="let p of productos">
        <ion-label>{{ p.nombre }}</ion-label>
        <ion-button slot="end" color="danger" fill="clear" (click)="eliminar(p.id)">Eliminar</ion-button>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
